[project]
name = "db-explorer"
version = "0.1.0"
description = "An MCP server that lets Claude explore and query your databases"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",          # The MCP SDK - lets us build an MCP server
    "sqlalchemy[asyncio]>=2.0",  # Talks to databases (SQLite, Postgres, MySQL)
    "aiosqlite>=0.20.0",         # Async SQLite driver
    "python-dotenv>=1.0.0",      # Reads config from .env files
]

[project.optional-dependencies]
# Install these only if you need Postgres or MySQL
postgres = ["asyncpg>=0.29.0"]
mysql = ["aiomysql>=0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_explorer"]